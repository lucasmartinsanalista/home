<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas Martins | Consultor de Tráfego e Marketing</title>
  <meta name="description" content="Lucas Martins | Consultor de Marketing Digital, especialista em tráfego pago, anúncios online e performance para negócios locais.">
  <meta name="keywords" content="tráfego pago, anúncios online, marketing digital, Google Ads, Facebook Ads, consultor de tráfego, Lucas Martins">
  <meta name="author" content="Lucas Martins">
  <link rel="icon" type="image/png" href="0956492b-8bb0-42f2-b0c0-78047ac0b5a6.png" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0e0e0e, #1a1a1a);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }
    .profile-pic {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin: 30px auto 10px;
      border: 3px solid #00ffa2;
    }
    h1 {
      font-size: 1.5rem;
      color: #00ffa2;
    }
    .link-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      width: 90%;
      max-width: 400px;
    }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border: 2px solid #00ffa2;
      color: #00ffa2;
      background-color: #111;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .social-link:hover {
      background: #00ffa2;
      color: #000;
    }
    .social-link img {
      width: 24px;
      height: 24px;
    }
    .carousel-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-top: 30px;
      padding: 0 20px;
    }
    .carousel {
      display: flex;
      transition: transform 0.5s ease-in-out;
      will-change: transform;
    }
    .card {
      flex: 0 0 280px;
      background: linear-gradient(135deg, #222, #2c2c2c);
      border: 1px solid #00ffa2;
      border-radius: 10px;
      padding: 15px;
      margin: 0 10px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 255, 162, 0.2);
    }
    .card img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #00ffa2;
      color: #000;
      border: none;
      padding: 12px;
      cursor: pointer;
      z-index: 1;
      border-radius: 50%;
    }
    .arrow.left {
      left: 10px;
    }
    .arrow.right {
      right: 10px;
    }
    @media (max-width: 768px) {
      h1 {
        font-size: 1.2rem;
      }
      .card {
        flex: 0 0 85%;
      }
      .social-link {
        font-size: 14px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <img src="0956492b-8bb0-42f2-b0c0-78047ac0b5a6.png" alt="Lucas Martins" class="profile-pic" />
  <h1>Consultor de Tráfego & Marketing Digital</h1>
  <div class="link-container">
    <a class="social-link" href="https://www.instagram.com/lucasmartins.ads" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" /> Instagram
    </a>
    <a class="social-link" href="https://www.linkedin.com/in/lucasmartinsrodrigues" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png" alt="LinkedIn" /> LinkedIn
    </a>
    <a class="social-link" href="https://wa.me/5531996066172" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" /> WhatsApp
    </a>
    <a class="social-link" href="https://www.tiktok.com/@lucasmartinsanalista" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046122.png" alt="TikTok" /> TikTok
    </a>
    <a class="social-link" href="https://www.youtube.com/@lucasmartinsanalista" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" /> YouTube
    </a>
  </div>

  <div class="carousel-wrapper">
    <button class="arrow left" onclick="scrollCarousel(-1)">&#8592;</button>
    <div class="carousel" id="carousel">
      <!-- Os cards de resultados já inseridos anteriormente permanecem aqui -->
    </div>
    <button class="arrow right" onclick="scrollCarousel(1)">&#8594;</button>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    let scrollIndex = 0;
    function scrollCarousel(direction) {
      const cardWidth = carousel.querySelector('.card').offsetWidth + 20;
      scrollIndex += direction;
      const maxScroll = carousel.children.length - Math.floor(carousel.parentElement.offsetWidth / cardWidth);
      if (scrollIndex < 0) scrollIndex = 0;
      if (scrollIndex > maxScroll) scrollIndex = maxScroll;
      carousel.style.transform = `translateX(-${scrollIndex * cardWidth}px)`;
    }
  </script>
</body>
</html>
