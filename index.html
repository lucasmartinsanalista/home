<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas Martins | Links</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-img {
      margin-top: 40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    .links {
      margin-top: 30px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      border: 2px solid #000;
      border-radius: 8px;
      text-decoration: none;
      color: #000;
      font-weight: bold;
      transition: background-color 0.3s, color 0.3s;
    }

    .link-item:hover, .link-item:active {
      background-color: #000;
      color: #fff;
    }

    .link-item img {
      width: 20px;
      height: 20px;
    }

    .video {
      margin-top: 40px;
      width: 90%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
    }

    @media (max-width: 768px) {
      .link-item {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <img class="profile-img" src="perfil.jpg" alt="Foto de perfil" />
  <div class="links">
    <a class="link-item" href="https://www.instagram.com/lucasmartins.ads" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" /> Instagram
    </a>
    <a class="link-item" href="https://www.linkedin.com/in/lucasmartinsrodrigues" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/145/145807.png" alt="LinkedIn" /> LinkedIn
    </a>
    <a class="link-item" href="https://api.whatsapp.com/send?phone=5531996066172" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" /> WhatsApp
    </a>
    <a class="link-item" href="https://www.tiktok.com/@lucasmartinsanalista" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok" /> TikTok
    </a>
    <a class="link-item" href="https://www.youtube.com/@lucasmartinsanalista" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube" /> YouTube
    </a>
  </div>

  <div class="video">
    <iframe width="100%" height="100%" src="https://www.youtube.com/embed/ww_AaC3c95o?autoplay=1&mute=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</body>
</html>
